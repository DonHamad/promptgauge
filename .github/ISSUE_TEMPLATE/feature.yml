name: Feature request
description: Propose a documented, local-first change
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, prompt bodies, or private source.
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use case
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Official Claude Code evidence
      description: Link the docs field when the change depends on Claude Code. No evidence = no claim.
