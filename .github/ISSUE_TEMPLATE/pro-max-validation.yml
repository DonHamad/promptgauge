name: Pro/Max telemetry validation
description: Report whether official quota fields appear on a live Pro/Max session
title: "validation: Pro/Max telemetry "
labels: ["validation"]
body:
  - type: markdown
    attributes:
      value: |
        Report field **availability** only.

        Do not paste Claude credentials, OAuth tokens, quota percentages if you consider them private, prompt text, transcripts, or project paths.
  - type: input
    id: claude
    attributes:
      label: Claude Code version
    validations:
      required: true
  - type: input
    id: pg
    attributes:
      label: PromptGauge version
    validations:
      required: true
  - type: dropdown
    id: plan
    attributes:
      label: Plan category (optional)
      options:
        - Prefer not to say
        - Pro
        - Max
        - Team / Enterprise
        - API / other
  - type: dropdown
    id: five
    attributes:
      label: rate_limits.five_hour observed?
      options: [yes, no, not sure]
    validations:
      required: true
  - type: dropdown
    id: seven
    attributes:
      label: rate_limits.seven_day observed?
      options: [yes, no, not sure]
    validations:
      required: true
  - type: dropdown
    id: spend
    attributes:
      label: rate_limits.spend_limit observed?
      options: [yes, no, not applicable, not sure]
    validations:
      required: true
  - type: dropdown
    id: cost
    attributes:
      label: cost.total_cost_usd observed?
      options: [yes, no, not sure]
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: context_window observed?
      options: [yes, no, not sure]
    validations:
      required: true
  - type: dropdown
    id: cache
    attributes:
      label: prompt_cache observed?
      options: [yes, no, not sure]
    validations:
      required: true
  - type: dropdown
    id: promptid
    attributes:
      label: prompt_id present on hooks and status line?
      options: [yes, no, not sure]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Sanitized notes
      description: Installation issues, doctor FAIL lines, or “field absent after a real API response.” No secrets.
